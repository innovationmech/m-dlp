[project]
name = "m-dlp"
version = "0.1.0"
description = "A CLI to resolve magnet links, select files, and download with libtorrent"
readme = "README.md"
authors = [
    { name = "jackelyj", email = "jackelyj@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "libtorrent>=2.0.11,<2.1",
    "prompt-toolkit>=3.0.52,<4",
    "rich>=13.9,<15",
]

[project.scripts]
m-dlp = "m_dlp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
